  --logo-emblem:var(--emblem-navy);
  --logo-full:var(--full-navy);

  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#03234B; --muted:#4F5B73;
  --line:#D8DEEB; --field:#7A879F;
  --primary:#03234B; --on-primary:#FFFFFF; --tint:#E5EBF7;
  --gold:#E29C03; --card-ink:#03234B; --gold-text:#9A6100; --star:#E29C03;
  --good:#1B7A3D; --good-bg:#E2F4E8;
  --warn:#9A3F00; --warn-bg:#FFEBD6;
  --bad:#B3261E; --bad-bg:#FDE7E5;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --logo-emblem:var(--emblem-pale); --logo-full:var(--full-pale);
    --bg:#071328; --surface:#0F1F3F; --ink:#EEF2FF; --muted:#A7B3D0;
    --line:#22345D; --field:#6D7DA5;
    --primary:#F0AE1F; --on-primary:#03234B; --tint:#1A2C58;
    --gold-text:#F0B429;
    --good:#78D695; --good-bg:#153526;
    --warn:#FFB47E; --warn-bg:#3A2413;
    --bad:#FF9C94; --bad-bg:#40191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --logo-emblem:var(--emblem-pale); --logo-full:var(--full-pale);
  --bg:#071328; --surface:#0F1F3F; --ink:#EEF2FF; --muted:#A7B3D0;
  --line:#22345D; --field:#6D7DA5;
  --primary:#F0AE1F; --on-primary:#03234B; --tint:#1A2C58;
  --gold-text:#F0B429;
  --good:#78D695; --good-bg:#153526;
  --warn:#FFB47E; --warn-bg:#3A2413;
  --bad:#FF9C94; --bad-bg:#40191A;
  color-scheme:dark;
}
:root[lang="ar"]{
  --display:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  --body:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body)}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[dir="rtl"] *{letter-spacing:0 !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1040px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}

/* header + brand */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.emblem{flex:none;width:46px;height:47px;background:var(--logo-emblem) center/contain no-repeat}
.brand h1{margin:0;font:800 1.4rem/1.05 var(--display);letter-spacing:-.01em}
.b-gold{color:var(--gold-text)}
.school{margin:3px 0 0;font-size:.75rem;line-height:1.25;color:var(--muted);font-weight:500;text-wrap:balance}
.hdr-right{display:flex;align-items:center;gap:8px;flex:none}
.langsel{width:auto;min-height:40px;padding:0 12px;border:1.5px solid var(--field);border-radius:99px;background:var(--surface);color:var(--ink);font:600 .875rem var(--body);cursor:pointer}

.grid{display:grid;gap:18px}
@media (min-width:860px){
  .grid{grid-template-columns:minmax(300px,380px) 1fr;gap:28px;align-items:start}
  .stage{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}

/* children switcher */
.kids{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 14px;margin:0 -4px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kid{flex:none;display:flex;align-items:center;gap:8px;min-height:46px;padding-block:5px;padding-inline:5px 16px;border:1.5px solid var(--field);border-radius:99px;background:var(--surface);color:var(--ink);font:600 .9375rem var(--body);cursor:pointer}
.kid[aria-pressed="true"]{border-color:var(--primary);background:var(--tint)}
.kid.add{border-style:dashed;color:var(--muted)}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--av,#E29C03);color:#03234B;font:800 1rem var(--display)}
.av.plusav{background:transparent;border:1.5px dashed var(--field);color:var(--muted);font-weight:600}

/* the canteen card */
.lunchcard{position:relative;overflow:hidden;background:var(--gold);color:var(--card-ink);border-radius:24px;padding:40px 24px 22px;box-shadow:0 18px 30px -18px rgba(3,35,75,.6)}
.lunchcard>p,.lunchcard>div{position:relative}
.wm{position:absolute;inset-inline-end:14px;bottom:50px;width:88px;height:90px;background:var(--emblem-navy) center/contain no-repeat;opacity:.16;pointer-events:none}
.slot{position:absolute;top:13px;left:50%;width:46px;height:11px;margin-left:-23px;border-radius:6px;background:var(--bg);box-shadow:inset 0 2px 3px rgba(3,35,75,.4)}
.lc-who{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 20px}
.lc-who strong{font:700 1.125rem/1.2 var(--display)}
.lc-who span{font-weight:600;font-size:.9375rem;white-space:nowrap}
.lc-label{margin:0;font-size:.875rem;font-weight:600;opacity:.85}
.lc-balance{margin:0 0 16px;font:800 clamp(2.5rem,11vw,3.4rem)/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pins{display:flex;gap:7px;margin-bottom:8px}
.pin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(3,35,75,.5)}
.pin.on{background:var(--card-ink);border-color:var(--card-ink)}
.pin.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i) * 55ms)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.lc-meals{margin:0 0 16px;font-size:.9375rem;font-weight:600}
.lc-num{margin:0;padding-top:12px;border-top:1.5px dashed rgba(3,35,75,.4);font:600 .875rem var(--body);letter-spacing:.12em}

.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-block:6px;padding-inline:14px 8px;border-radius:14px;font-size:.9375rem;font-weight:500;border:1.5px solid transparent}
.strip.has{background:var(--warn-bg);color:var(--warn)}
.strip.none{background:var(--good-bg);color:var(--good)}
.strip.unset{background:var(--tint);border-color:var(--primary);border-style:dashed;color:var(--ink)}
.linkbtn{flex:none;background:none;border:0;padding:8px;min-height:44px;font:700 .9375rem var(--body);color:var(--primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.strip .linkbtn{color:inherit}
.linkbtn.danger{color:var(--bad)}

.empty{position:relative;border:2px dashed var(--field);border-radius:24px;padding:44px 24px 28px;text-align:center}
.empty h2{margin:8px 0;font:700 1.375rem/1.25 var(--display)}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .btn{margin-bottom:6px}

/* panels */
.panels{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--bg)}
.tab{position:relative;min-height:46px;padding:4px 2px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:700 .875rem/1.2 var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.tab .dot{position:absolute;top:5px;inset-inline-end:4px;width:11px;height:11px;border-radius:50%;background:#E5533D;border:2px solid var(--surface)}
.pane{padding:22px 12px 14px}
.pane h2{margin:0 0 4px;font:700 1.375rem/1.25 var(--display);letter-spacing:-.01em}
.lede{margin:0 0 20px;color:var(--muted)}
.sub{margin:28px 0 0;font:700 1.0625rem var(--display)}

/* forms */
fieldset{border:0;margin:0 0 20px;padding:0;min-width:0}
legend{padding:0;margin:0 0 8px;font-weight:700}
.field{margin-bottom:14px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9375rem}
input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--field);border-radius:12px;background:var(--bg);color:var(--ink);font:400 1rem var(--body)}
textarea{min-height:96px;resize:vertical}
::placeholder{color:var(--muted);opacity:.8}
[aria-invalid="true"]{border-color:var(--bad) !important}
.err{margin:6px 0 0;color:var(--bad);font-size:.875rem;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--muted);font-size:.9375rem}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.amt{min-height:58px;border:1.5px solid var(--field);border-radius:14px;background:var(--surface);color:var(--ink);font:800 1.25rem var(--display);cursor:pointer}
.amt[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.prefix{position:relative}
.prefix span{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.prefix input{padding-inline-start:58px !important}
.summary{margin:0 0 22px;padding:12px 14px;border-radius:12px;background:var(--tint);font-weight:500}
.notice{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:.9375rem}
.notice strong{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;border:1.5px solid transparent;font:700 1rem var(--body);cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary);width:100%}
.btn.ghost{background:transparent;border-color:var(--field);color:var(--ink)}
.btn[disabled]{opacity:.7;cursor:progress}
.actions{display:grid;gap:10px;margin-top:18px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--field);border-radius:99px;background:var(--surface);color:var(--ink);font:600 .9375rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--primary);color:var(--primary)}
.chip[aria-pressed="true"]::before{content:"\2713";font-weight:800}

.stars{display:flex;gap:2px;margin-inline-start:-6px}
.star{width:52px;height:52px;padding:7px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.star svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.star.on{color:var(--ink)}
.star.on svg{fill:var(--star)}
.ratingword{margin:2px 0 0;min-height:1.5em}

.opt{display:flex;align-items:flex-start;gap:12px;margin:0 0 8px;padding:12px 14px;border:1.5px solid var(--field);border-radius:14px;font-weight:400;cursor:pointer}
.opt:has(input:checked){border-color:var(--primary);background:var(--tint)}
.opt input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary)}
.opt strong{display:block;font-weight:700}
.opt small{color:var(--muted);font-size:.875rem}

/* success */
.done{padding:14px 4px 4px;text-align:center}
.check{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--good-bg);color:var(--good)}
.done h2{font:800 1.5rem/1.25 var(--display);margin:0 0 6px}
.done h2:focus{outline:none}
.done p{margin:0 0 4px}
.ref{color:var(--muted);font-size:.875rem}

.hist,.rev{list-style:none;margin:6px 0 0;padding:0}
.hist li,.rev li{padding:13px 0;border-top:1px solid var(--line)}
.hist li{display:flex;justify-content:space-between;gap:12px}
.hist small{display:block;color:var(--muted)}
.amt-in{font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rs{letter-spacing:2px;color:var(--star);white-space:nowrap}
.rs i{font-style:normal;color:var(--field)}
.rev p{margin:4px 0 0}
.rev .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.875rem;margin-top:2px}

/* menu */
.mblurb{margin:16px 0 0;color:var(--muted)}
.mgroup{margin:22px 0 0}
.mgroup h3{margin:0 0 2px;font:700 1.0625rem var(--display)}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:baseline;gap:8px;padding:9px 0}
.mi{min-width:0}
.qty{margin-inline-start:6px;color:var(--muted);font-size:.9375rem}
.mnote{display:inline-block;margin-inline-start:8px;padding:1px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:.8125rem;font-weight:600}
.lead{flex:1;min-width:16px;border-bottom:2px dotted var(--field);transform:translateY(-4px)}
.mp{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.mp.extra{color:var(--muted);font-weight:600}

/* admin */
.adm{max-width:720px;margin:0 auto}
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.adm-head h2{margin:0;font:800 1.5rem/1.2 var(--display)}
.adm-head .btn{min-height:44px;width:auto;padding:0 18px;white-space:nowrap;flex:none}
.adm-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.stat.total{grid-column:1/-1;background:var(--gold);border-color:transparent;color:var(--card-ink)}
.stat span{display:block;font-size:.8125rem;font-weight:600;opacity:.85}
.stat b{display:block;font:800 1.5rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.adm-list{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.adm-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px}
.adm-list li+li{border-top:1px solid var(--line)}
.adm-list small{display:block;color:var(--muted)}
.bal{font:800 1.0625rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.bal.zero{color:var(--muted);font-weight:600}
.adm-link{display:block;margin:6px auto 0}
.stage-actions{display:flex;justify-content:center;margin-top:4px}
dialog{width:min(440px,calc(100% - 32px));border:0;border-radius:22px;padding:24px 20px;background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(3,15,36,.6)}
dialog h2{margin:0 0 16px;font:700 1.375rem/1.25 var(--display)}
#langDlg{text-align:center}
#langDlg:focus{outline:none}
#langDlg h2{margin:0 0 2px}
.logo-full{width:min(190px,58%);aspect-ratio:360/465;margin:0 auto 14px;background:var(--logo-full) center/contain no-repeat}
.lang-sub{margin:0;color:var(--muted);font-size:1.0625rem}
.langs{display:grid;gap:10px;margin-top:18px}
.langs .btn{width:100%;font-size:1.125rem}

.foot{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px;color:var(--muted);font-size:.875rem;font-weight:600}
.codein{font:700 1.25rem var(--body);letter-spacing:.12em;text-align:center;text-transform:uppercase}
.foot .linkbtn{color:var(--muted);font-size:.875rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
}
@media (max-width:380px){
  .amt{font-size:1.0625rem}
  .tab{font-size:.8125rem}
  .lunchcard{padding-left:20px;padding-right:20px}
  .brand h1{font-size:1.25rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="emblem" aria-hidden="true"></span>
      <div>
        <h1><span>Beverly</span> <span class="b-gold">Bites</span></h1>
        <p class="school">Beverly Hills School, Sheikh Zayed</p>
      </div>
    </div>
    <div class="hdr-right">
      <select class="langsel" id="langSel" aria-label="Language / اللغة / Sprache">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>

  <main class="grid">
    <section class="stage" data-i18n-aria="sec.card">
      <div id="kids" class="kids" role="group" data-i18n-aria="kids.aria" hidden></div>
      <div id="cardArea"></div>
      <div class="stage-actions" id="stageActions" hidden><button type="button" class="linkbtn" id="logoutBtn" data-i18n="logout.btn"></button></div>
    </section>

    <section class="panels" id="panels" data-i18n-aria="sec.actions" hidden>
      <div class="tabs" id="tabs" role="tablist" data-i18n-aria="sec.actions">
        <button type="button" class="tab" role="tab" id="tab-topup" aria-controls="panel-topup" aria-selected="true" data-i18n="tab.topup"></button>
        <button type="button" class="tab" role="tab" id="tab-menu" aria-controls="panel-menu" aria-selected="false" tabindex="-1" data-i18n="tab.menu"></button>
        <button type="button" class="tab" role="tab" id="tab-reviews" aria-controls="panel-reviews" aria-selected="false" tabindex="-1" data-i18n="tab.reviews"></button>
        <button type="button" class="tab" role="tab" id="tab-allergies" aria-controls="panel-allergies" aria-selected="false" tabindex="-1"><span data-i18n="tab.allergies"></span><span class="dot" id="allergyDot" hidden><span class="sr" data-i18n="tab.allergies.dot"></span></span></button>
      </div>

      <!-- TOP UP -->
      <div class="pane" role="tabpanel" id="panel-topup" aria-labelledby="tab-topup">
        <div id="topupForm">
          <h2 id="topupTitle" data-i18n="tu.titleGeneric"></h2>
          <p class="lede" data-i18n="tu.lede"></p>
          <form id="payForm" novalidate>
            <fieldset>
              <legend data-i18n="tu.howMuch"></legend>
              <div class="amts" id="amts"></div>
              <div class="prefix"><span id="sym" aria-hidden="true"></span><input id="custom" type="text" inputmode="decimal" autocomplete="off" data-i18n-ph="tu.other" data-i18n-aria="tu.other"></div>
              <p class="err" id="amt-err" role="alert" hidden></p>
            </fieldset>
            <p class="summary" id="summary" aria-live="polite"></p>

            <fieldset>
              <legend data-i18n="tu.payLegend"></legend>
              <p class="notice"><strong data-i18n="tu.notice.a"></strong><span data-i18n="tu.notice.b"></span></p>
              <div class="field">
                <label for="cName" data-i18n="tu.cName"></label>
                <input id="cName" type="text" autocomplete="off" maxlength="60">
                <p class="err" id="cName-err" hidden></p>
              </div>
              <div class="field">
                <label for="cNum" data-i18n="tu.cNum"></label>
                <input id="cNum" type="text" dir="ltr" inputmode="numeric" autocomplete="off" placeholder="1234 5678 9012 3456" maxlength="23">
                <p class="err" id="cNum-err" hidden></p>
              </div>
              <div class="two">
                <div class="field">
                  <label for="cExp" data-i18n="tu.cExp"></label>
                  <input id="cExp" type="text" dir="ltr" inputmode="numeric" autocomplete="off" placeholder="MM/YY" maxlength="5">
                  <p class="err" id="cExp-err" hidden></p>
                </div>
                <div class="field">
                  <label for="cCvc" data-i18n="tu.cCvc"></label>
                  <input id="cCvc" type="text" dir="ltr" inputmode="numeric" autocomplete="off" placeholder="123" maxlength="4">
                  <p class="err" id="cCvc-err" hidden></p>
                </div>
              </div>
            </fieldset>
            <button class="btn primary" id="payBtn" type="submit" data-i18n="tu.payGeneric"></button>
          </form>
        </div>

        <div id="topupDone" class="done" hidden>
          <div class="check" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <h2 id="doneTitle" tabindex="-1"></h2>
          <p id="doneBal"></p>
          <p class="ref" id="doneRef"></p>
          <div class="actions">
            <button type="button" class="btn ghost" id="againBtn" data-i18n="done.again"></button>
            <button type="button" class="btn ghost" id="toReviewBtn" data-i18n="done.review"></button>
          </div>
        </div>

        <h3 class="sub" data-i18n="hist.title"></h3>
        <ul class="hist" id="hist"></ul>
      </div>

      <!-- MENU -->
      <div class="pane" role="tabpanel" id="panel-menu" aria-labelledby="tab-menu" hidden>
        <h2 data-i18n="menu.title"></h2>
        <p class="lede" data-i18n="menu.lede"></p>
        <div class="chips" id="menuCats" role="group" data-i18n-aria="menu.cat.aria"></div>
        <div id="menuBody"></div>
      </div>

      <!-- REVIEWS -->
      <div class="pane" role="tabpanel" id="panel-reviews" aria-labelledby="tab-reviews" hidden>
        <h2 data-i18n="rev.title"></h2>
        <p class="lede" data-i18n="rev.lede"></p>
        <form id="reviewForm" novalidate>
          <div class="field">
            <label for="dishSel" data-i18n="rev.about"></label>
            <select id="dishSel"></select>
            <p class="err" id="dish-err" role="alert" hidden></p>
          </div>
          <fieldset>
            <legend id="ratingLegend" data-i18n="rev.how"></legend>
            <div class="stars" id="stars" role="radiogroup" aria-labelledby="ratingLegend"></div>
            <p class="hint ratingword" id="ratingWord"></p>
            <p class="err" id="rating-err" role="alert" hidden></p>
          </fieldset>
          <div class="field">
            <label for="rText" data-i18n="rev.more"></label>
            <textarea id="rText" maxlength="500" data-i18n-ph="rev.morePh"></textarea>
          </div>
          <button class="btn primary" type="submit" data-i18n="rev.send"></button>
        </form>
        <h3 class="sub" data-i18n="rev.yours"></h3>
        <ul class="rev" id="revList"></ul>
      </div>

      <!-- ALLERGIES -->
      <div class="pane" role="tabpanel" id="panel-allergies" aria-labelledby="tab-allergies" hidden>
        <h2 id="allergyTitle" data-i18n="alg.title"></h2>
        <p class="lede" data-i18n="alg.lede"></p>
        <form id="allergyForm" novalidate>
          <label class="opt" for="noneChk"><input type="checkbox" id="noneChk"><span><strong data-i18n="alg.none"></strong></span></label>
          <fieldset>
            <legend data-i18n="alg.legend"></legend>
            <div class="chips" id="allergens" role="group" data-i18n-aria="alg.legend"></div>
          </fieldset>
          <fieldset id="sevWrap">
            <legend data-i18n="alg.sevLegend"></legend>
            <label class="opt"><input type="radio" name="sev" value="mild" checked><span><strong data-i18n="sev.mild"></strong><small data-i18n="sev.mild.d"></small></span></label>
            <label class="opt"><input type="radio" name="sev" value="moderate"><span><strong data-i18n="sev.moderate"></strong><small data-i18n="sev.moderate.d"></small></span></label>
            <label class="opt"><input type="radio" name="sev" value="severe"><span><strong data-i18n="sev.severe"></strong><small data-i18n="sev.severe.d"></small></span></label>
          </fieldset>
          <div class="field">
            <label for="aNotes" data-i18n="alg.notes"></label>
            <textarea id="aNotes" maxlength="300" data-i18n-ph="alg.notesPh"></textarea>
          </div>
          <p class="err" id="allergy-err" role="alert" hidden></p>
          <p class="notice" data-i18n="alg.notice"></p>
          <button class="btn primary" type="submit" data-i18n="alg.save"></button>
        </form>
      </div>
    </section>
  </main>

  <section class="adm" id="adminView" aria-labelledby="admHeading" hidden>
    <div class="adm-head">
      <h2 id="admHeading" data-i18n="admin.heading"></h2>
      <button type="button" class="btn ghost" id="adminOut" data-i18n="admin.logout"></button>
    </div>
    <div class="adm-stats" id="admStats"></div>
    <p class="summary" data-i18n="admin.note"></p>
    <input id="admSearch" type="text" autocomplete="off" data-i18n-ph="admin.search" data-i18n-aria="admin.search">
    <ul class="adm-list" id="admList"></ul>
  </section>

  <footer class="foot"><span>Good Food. Good Breaks.</span></footer>
</div>

<dialog id="addDlg" aria-labelledby="addTitle">
  <h2 id="addTitle" data-i18n="add.title"></h2>
  <form id="addForm" novalidate>
    <p class="lede" data-i18n="add.lede"></p>
    <div class="field">
      <label for="kCode" data-i18n="add.code"></label>
      <input id="kCode" class="codein" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX">
      <p class="err" id="kCode-err" hidden></p>
    </div>
    <div class="actions">
      <button type="submit" id="addSubmit" class="btn primary" data-i18n="btn.addChild"></button>
      <button type="button" class="btn ghost" id="addCancel" data-i18n="btn.cancel"></button>
    </div>
    <button type="button" class="linkbtn adm-link" data-admin="1" data-i18n="admin.login"></button>
  </form>
</dialog>

<dialog id="adminDlg" aria-labelledby="adminTitle">
  <h2 id="adminTitle" data-i18n="admin.login"></h2>
  <form id="adminForm" novalidate>
    <div class="field">
      <label for="adminPw" data-i18n="admin.pw"></label>
      <input id="adminPw" type="password" dir="ltr" autocomplete="off">
      <p class="err" id="adminPw-err" hidden></p>
    </div>
    <div class="actions">
      <button type="submit" id="adminSubmit" class="btn primary" data-i18n="admin.signin"></button>
      <button type="button" class="btn ghost" id="adminCancel" data-i18n="btn.cancel"></button>
    </div>
  </form>
</dialog>

<dialog id="langDlg" aria-labelledby="langTitle" autofocus>
  <div class="logo-full" role="img" aria-label="Beverly Bites, Beverly Hills School, Sheikh Zayed"></div>
  <h2 id="langTitle" lang="en">Choose your language</h2>
  <p class="lang-sub" lang="ar" dir="rtl">اختر لغتك</p>
  <p class="lang-sub" lang="de">Sprache wählen</p>
  <div class="langs">
    <button type="button" class="btn ghost" data-lang="en" lang="en">English</button>
    <button type="button" class="btn ghost" data-lang="ar" lang="ar">العربية</button>
    <button type="button" class="btn ghost" data-lang="de" lang="de">Deutsch</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Settings you can change
   ===================================================================== */
var LUNCH_PRICE=10000;                 // piastres (100 = EGP 1). Used for the "lunches left" estimate: EGP 100
var MIN_TOPUP=2000, MAX_TOPUP=200000, DEFAULT_AMOUNT=20000; // EGP 20, EGP 2,000, EGP 200
var PRESETS=[10000,20000,50000,100000];                     // EGP 100, 200, 500, 1,000
var KEY='canteen-portal-v4', LANG_KEY='canteen-lang';
var ALLERGENS=['Celery','Gluten','Crustaceans','Eggs','Fish','Lupin','Milk','Molluscs','Mustard','Peanuts','Sesame','Soya','Sulphites','Tree nuts'];
var AVATARS=['#E29C03','#8FB4FF','#8EDBA6','#FFA8C5'];
var TABS=['topup','menu','reviews','allergies'];

/* Grade 11 roster. Every student record is encrypted with that student's own code,

function gradeLabel(n){
  if(lang==='ar')return 'الصف '+(AR_ORD[n]||n);
  if(lang==='de')return 'Klasse '+n;
  return 'Grade '+n;
}
function normCode(v){return String(v).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtCode(c){return c.length>4?c.slice(0,4)+'-'+c.slice(4):c;}
function b64bytes(x){var b=atob(x),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function aesKeyFrom(secret,salt,iter){
  var subtle=window.crypto.subtle,enc=new TextEncoder();
  return subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveKey']).then(function(km){
    return subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  });
}
function codeId(code){
  return window.crypto.subtle.digest('SHA-256',new TextEncoder().encode('bb-g11:'+code)).then(function(h){return toHex(h).slice(0,16);});
}
function adminUnlock(pw){
  var subtle=window.crypto&&window.crypto.subtle;
  if(!subtle)return Promise.reject(new Error('nocrypto'));
  return aesKeyFrom(pw,b64bytes(ADMIN.s),ADMIN.iter).then(function(key){
    return subtle.decrypt({name:'AES-GCM',iv:b64bytes(ADMIN.iv)},key,b64bytes(ADMIN.c));
  }).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));}).catch(function(){return null;});
}
function findStudent(code){
  var subtle=window.crypto&&window.crypto.subtle;
  if(!subtle)return Promise.reject(new Error('nocrypto'));
  var enc=new TextEncoder();
  return subtle.digest('SHA-256',enc.encode('bb-g11:'+code)).then(function(h){
    var id=toHex(h).slice(0,16),rec=ROSTER.filter(function(r){return r.id===id;})[0];
    if(!rec)return null;
    return subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']).then(function(km){
      return subtle.deriveKey({name:'PBKDF2',salt:b64bytes(rec.s),iterations:ROSTER_ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return subtle.decrypt({name:'AES-GCM',iv:b64bytes(rec.iv)},key,b64bytes(rec.c));
    }).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));}).catch(function(){return null;});
  });
}

function lunchesText(n){
  if(lang==='ar')return n===1?'وجبة واحدة':(n===2?'وجبتان':((n>=3&&n<=10)?n+' وجبات':n+' وجبة'));
  if(lang==='de')return n+' Mittagessen';
  return n+(n===1?' lunch':' lunches');
}

/* =====================================================================
   Helpers
   ===================================================================== */
var fmt0,fmt2;
function setFormats(){
  var n=LANGS[lang].num;
  fmt0=new Intl.NumberFormat(n,{maximumFractionDigits:0});
  fmt2=new Intl.NumberFormat(n,{minimumFractionDigits:2,maximumFractionDigits:2});
}
setFormats();
function money(p){
  var v=p/100,n=(v%1===0?fmt0:fmt2).format(v);
  if(lang==='ar')return n+'\u00A0\u062C.\u0645';
  if(lang==='de')return n+'\u00A0EGP';
  return 'EGP\u00A0'+n;
}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function uid(){return Math.random().toString(36).slice(2,9);}
function firstName(n){return String(n).trim().split(/\s+/)[0]||'';}
function initial(n){return (Array.from(String(n).trim())[0]||'?').toUpperCase();}
function fmtDate(ts){return new Date(ts).toLocaleDateString(LANGS[lang].locale,{day:'numeric',month:'short',year:'numeric'});}
function stepOf(e){
  var rtl=document.documentElement.dir==='rtl';
  if(e.key==='ArrowUp')return 1;
  if(e.key==='ArrowDown')return -1;
  if(e.key==='ArrowRight')return rtl?-1:1;
  if(e.key==='ArrowLeft')return rtl?1:-1;
  return 0;
}
function openDlg(d){if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','');}
function closeDlg(d){if(typeof d.close==='function')d.close();else d.removeAttribute('open');}

/* =====================================================================
   State (browser storage only, guarded)
   ===================================================================== */
function blank(){return {kids:[],stash:[],active:null,reviews:[]};}
function defaultAllergy(){return {status:'unset',items:[],severity:'mild',notes:'',updated:null};}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return blank();
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.kids)||!Array.isArray(s.reviews))return blank();
    s.stash=Array.isArray(s.stash)?s.stash:[];
    s.kids.concat(s.stash).forEach(function(k){k.txns=Array.isArray(k.txns)?k.txns:[];k.allergy=k.allergy&&Array.isArray(k.allergy.items)?k.allergy:defaultAllergy();k.balance=+k.balance||0;});
    return s;
  }catch(e){return blank();}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var state=load();
function kid(){return state.kids.filter(function(k){return k.id===state.active;})[0]||null;}
if(state.kids.length&&!kid())state.active=state.kids[0].id;
function newKid(name,grade,code,balance){return {id:uid(),name:name,grade:grade,code:code,balance:balance||0,txns:[],allergy:defaultAllergy()};}

var amount=DEFAULT_AMOUNT, custom=false, paying=false;
var rating=0, menuCat='mine', lastDone=null;
var toastTimer, booted=false;

function toast(msg){
  var el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},3400);
}
function setErr(id,msg){
  var i=$('#'+id),e=$('#'+id+'-err');if(!i||!e)return;
  if(msg){e.textContent=msg;e.hidden=false;i.setAttribute('aria-invalid','true');i.setAttribute('aria-describedby',id+'-err');}
  else{e.textContent='';e.hidden=true;i.removeAttribute('aria-invalid');i.removeAttribute('aria-describedby');}
}
function groupErr(id,msg){var e=$('#'+id);e.textContent=msg;e.hidden=!msg;}
function clearErrors(){
  $$('.err').forEach(function(e){e.hidden=true;e.textContent='';});
  $$('[aria-invalid]').forEach(function(i){i.removeAttribute('aria-invalid');i.removeAttribute('aria-describedby');});
}

/* =====================================================================
   Tabs
   ===================================================================== */
function setTab(name,focus){
  TABS.forEach(function(x){
    var b=$('#tab-'+x),p=$('#panel-'+x),on=x===name;
    b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;p.hidden=!on;
  });
  if(focus)$('#tab-'+name).focus();
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)setTab(b.id.replace('tab-',''));});
$('#tabs').addEventListener('keydown',function(e){
  var i=TABS.indexOf(document.activeElement.id.replace('tab-','')),L=TABS.length;if(i<0)return;
  var n;
  if(e.key==='Home')n=0;else if(e.key==='End')n=L-1;
  else{var s=stepOf(e);if(!s||e.key==='ArrowUp'||e.key==='ArrowDown')return;n=(i+s+L)%L;}
  e.preventDefault();setTab(TABS[n],true);
});

function renderKids(){
  var el=$('#kids');el.hidden=state.kids.length===0;
  el.innerHTML=state.kids.map(function(k,i){
    return '<button type="button" class="kid" data-id="'+esc(k.id)+'" aria-pressed="'+(k.id===state.active)+'"><span class="av" style="--av:'+AVATARS[i%AVATARS.length]+'" aria-hidden="true">'+esc(initial(k.name))+'</span><span>'+esc(firstName(k.name))+'</span></button>';
  }).join('')+'<button type="button" class="kid add" id="addKidBtn"><span class="av plusav" aria-hidden="true">+</span><span>'+T('kids.add')+'</span></button>';
}
function allergyStrip(k){
  var a=k.allergy,cls,text,btn,sep=lang==='ar'?'، ':', ';
  if(a.status==='has'){cls='has';text=T('strip.has',{list:a.items.map(al).join(sep)||t('strip.notes')});btn='btn.update';}
  else if(a.status==='none'){cls='none';text=T('strip.none');btn='btn.update';}
  else{cls='unset';text=T('strip.unset');btn='btn.addNow';}
  return '<div class="strip '+cls+'"><span>'+text+'</span><button type="button" class="linkbtn" data-goto="allergies">'+T(btn)+'</button></div>';
}
function renderCard(opts){
  opts=opts||{};
  var el=$('#cardArea'),k=kid();
  if(!k){
    el.innerHTML='<div class="empty"><span class="slot" aria-hidden="true"></span><h2>'+T('empty.title')+'</h2><p>'+T('empty.text')+'</p><button type="button" class="btn primary" id="emptyAdd">'+T('btn.addChild')+'</button><button type="button" class="linkbtn" data-admin="1">'+T('admin.login')+'</button></div>';
    return;
  }
  var n=Math.floor(k.balance/LUNCH_PRICE),filled=Math.min(10,n),dots='';
  for(var i=0;i<10;i++){
    var on=i<filled;
    dots+='<span class="pin'+(on?' on':'')+(on&&opts.pop?' pop':'')+'" style="--i:'+i+'"></span>';
  }
  var meals=n===0?t('meals.none'):t('meals.text',{count:lunchesText(n),price:money(LUNCH_PRICE)});

function countUp(el,from,to){
  if(!el)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=money(to);return;}
  var t0=performance.now(),d=900;
  (function step(ts){
    var p=Math.min(1,Math.max(0,(ts-t0)/d)),e=1-Math.pow(1-p,3);
    el.textContent=money(Math.round(from+(to-from)*e));
    if(p<1)requestAnimationFrame(step);
  })(t0);
}

function luhn(num){
  var sum=0,alt=false;
  for(var i=num.length-1;i>=0;i--){
    var n=+num[i];if(alt){n*=2;if(n>9)n-=9;}
    sum+=n;alt=!alt;
  }
  return sum%10===0;
}
function brandOf(n){
  if(/^4/.test(n))return 'Visa';
  if(/^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(n))return 'Mastercard';
  if(/^3[47]/.test(n))return 'Amex';
  return 'Card';
}
function validateCard(){
  var ok=true;
  var name=$('#cName').value.trim();
  setErr('cName',name?'':t('err.cName'));if(!name)ok=false;
  var num=$('#cNum').value.replace(/\s/g,''),nm='';
  if(!/^\d{13,19}$/.test(num))nm=t('err.cNum1');
  else if(!luhn(num))nm=t('err.cNum2');
  setErr('cNum',nm);if(nm)ok=false;
  var em='',m=/^(\d{2})\/(\d{2})$/.exec($('#cExp').value);
  if(!m)em=t('err.exp1');
  else{
    var mm=+m[1],yy=2000+ +m[2],now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
    if(mm<1||mm>12)em=t('err.exp2');
    else if(yy<cy||(yy===cy&&mm<cm))em=t('err.exp3');
    else if(yy>cy+20)em=t('err.exp4');
  }
  setErr('cExp',em);if(em)ok=false;
  var cv=$('#cCvc').value,cm2=/^\d{3,4}$/.test(cv)?'':t('err.cvc');
  setErr('cCvc',cm2);if(cm2)ok=false;
  return ok;
}

  clearErrors();
  renderAll();
  if(snap)restoreAllergy(snap);
  $('#dishSel').value=dishVal;
  if(!$('#topupDone').hidden)renderDone();
  if(admin)renderAdmin();
}
function chooseLang(l){
  if(!LANGS[l])return;
  lang=l;saveLang(l);applyLang();
}
$('#langSel').addEventListener('change',function(e){chooseLang(e.target.value);});
var langDlg=$('#langDlg');
langDlg.addEventListener('cancel',function(e){e.preventDefault();});   // must pick a language
$$('#langDlg [data-lang]').forEach(function(b){
  b.addEventListener('click',function(){chooseLang(b.dataset.lang);closeDlg(langDlg);});
});

/* boot */
applyLang();
booted=true;
setTab('topup');
if(!loadLang())openDlg(langDlg);
})();
</script>
</body>
</html>
